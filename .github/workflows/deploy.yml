name: Deploy to Oracle Cloud Infrastructure (OCI)

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Oracle Cloud Infrastructure Registry (OCIR)
      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGISTRY_URL }} # Let's say lhr.ocir.io
          username: ${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }} # Generated OCI Auth token

      # Build and push the container image to OCI Registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_REPO_NAME }}:latest
            ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_REPO_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Setup Oracle Cloud Infrastructure CLI to issue a container instance reboot
      - name: Configure OCI CLI Credentials
        uses: oracle-actions/setup-oci-cli@v1.3.1
        with:
          user: ${{ secrets.OCI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          region: ${{ secrets.OCI_REGION }}
          api_key: ${{ secrets.OCI_PRIVATE_KEY }}

      # Restart container instance to pull fresh latest image tag automatically
      - name: Redeploy Container Instance
        run: |
          echo "Updating Container Instance to pull the new build..."
          # Fetch active container instance OCID
          OCI_CI_ID="${{ secrets.OCI_CONTAINER_INSTANCE_ID }}"
          
          # Command to force-restart the container instance to pull our newly pushed :latest image
          oci container-instances container-instance restart \
            --container-instance-id "$OCI_CI_ID" \
            --force
